spring.application.name=${SPRING_APP_NAME:springsecsection4}
logging.level.org.springframework.security=${SPRING_SECURITY_LOGGING_LEVEL:TRACE}


logging.pattern.console=${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}

spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABSE_NAME:eazybank}
#spring.datasource.url=jdbc:mysql://localhost:3306/easybank

#spring.datasource.url=jdbc:mysql://localhost3306/eazybank
spring.datasource.username=${DATABASE_USERNAME:root}
#spring.datasource.username=root
spring.datasource.password=${DATABASE_PASSWORD:root}
#spring.datasource.password=root


server.port=8090


spring.jpa.show-sql=${HIBERNATE_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
#logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE